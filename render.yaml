# Render Blueprint Specification for PM-CDSS Full-System Deployment
services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend Web Service (Docker)
  # -------------------------------------------------------------
  - type: web
    name: penmed-backend
    runtime: docker
    dockerContext: ./Backend
    dockerfilePath: ./Backend/Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
        # Enter your Neon DB connection string:
        # postgresql://neondb_owner:password@ep-xxxx.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 120
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: AUTO_SEED
        value: "true"
      - key: CORS_ORIGINS
        sync: false
        # Add your frontend URL here, e.g.:
        # https://penmed-frontend.onrender.com,http://localhost:3000

  # -------------------------------------------------------------
  # 2. Vue 3 + PrimeVue Frontend Web Service (Static Site)
  # -------------------------------------------------------------
  - type: web
    name: penmed-frontend
    runtime: static
    rootDir: Frontend
    buildCommand: bun install && bun run build-only
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
        # Enter your Backend Web Service URL followed by /api/v1:
        # e.g. https://penmed-backend.onrender.com/api/v1
