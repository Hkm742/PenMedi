services:
  postgres:
    image: postgres:16-alpine
    container_name: pm_cdss_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pm_password}
      POSTGRES_DB: ${POSTGRES_DB:-pm_cdss}
    ports:
      - "${HOST_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pm_cdss_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pm_user} -d ${POSTGRES_DB:-pm_cdss}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - pm_cdss_net

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: pm_cdss_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-pm_user}:${POSTGRES_PASSWORD:-pm_password}@postgres:5432/${POSTGRES_DB:-pm_cdss}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-penmed-cdss-super-secure-production-ready-jwt-key-cavendish-2026}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
    ports:
      - "8000:8000"
    volumes:
      - ./Backend/app:/app/app:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - pm_cdss_net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: pm_cdss_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - pm_cdss_net

volumes:
  pm_cdss_pgdata:
    name: pm_cdss_pgdata

networks:
  pm_cdss_net:
    name: pm_cdss_net
    driver: bridge
